# GEOM-Drugs with bond-free design.
#
# Paper 1 ablation Cell (2): "Our model on GEOM without bond supervision"
# Used to isolate the "bond-free" variable in the comparison matrix vs
# FlowMol3 (published) and our OMol25 bond-free + drift run.
#
# Difference from geom_cfm.yaml: total_loss_weights.e = 0.0.
# Everything else identical so the only variable changed is bond supervision.
#
# The preprocessed GEOM data at processed_data_dir still CONTAINS bond
# labels -- we just don't supervise them (loss weight = 0). This is
# cleaner than re-preprocessing GEOM to strip bonds: same data, one knob.
# scripts/run_train.py detects e==0 and auto-disables the valence/
# connectivity discrete-projection hooks.

training:
  output_dir: /n/holylabs/ryl_lab/Lab/yulili_cfm_mol/runs/geom_cfm_bondfree
  batch_size: 12
  num_workers: 6
  ema_decay: 0
  max_num_edges: 50000
  trainer_args:
    max_epochs: 20
    accelerator: gpu
    devices: 1
    num_nodes: 1
    accumulate_grad_batches: 4
    limit_val_batches: 0.002
    gradient_clip_val: 1.0

  evaluation:
    mols_to_sample: 100
    sample_interval: 0.05
    val_loss_interval: 0.05

wandb:
  project: cfm_mol
  entity:
  name: geom_cfm_bondfree
  mode: disabled

lr_scheduler:
  base_lr: 1.0e-4
  warmup_length: 0.0
  restart_interval: 0
  restart_type: 'linear'
  weight_decay: 1.0e-12

dataset:
  raw_data_dir: /n/holylabs/ryl_lab/Lab/yulili_cfm_mol/baselines/flowmol3/data/geom_raw/
  processed_data_dir: /n/holylabs/ryl_lab/Lab/yulili_cfm_mol/baselines/flowmol3/data/geom_5_kekulized/
  atom_map: ['C', 'H', 'N', 'O', 'F', 'P', 'S', 'Cl', 'Br', 'I']
  dataset_name: geom
  dataset_size:
  confs_per_mol:

checkpointing:
  save_last: True
  save_top_k: 3
  monitor: 'val_total_loss'
  every_n_epochs: 1

mol_fm:
  explicit_aromaticity: false
  distort_p: 0.2
  fake_atom_p: 0.3
  parameterization: ctmc
  time_scaled_loss: True
  total_loss_weights:
    x: 3.0
    a: 0.4
    c: 1.0
    e: 0.0                    # BOND-FREE (Cell 2 ablation)
  prior_config:
    x:
      align: True
      type: 'centered-normal'
      kwargs: {std: 1.0}
    a:
      align: False
      type: 'ctmc'
      kwargs: {}
    c:
      align: False
      type: 'ctmc'
      kwargs: {}
    e:
      align: False
      type: 'ctmc'
      kwargs: {}

vector_field:
  self_conditioning: True
  stochasticity: 30.0
  high_confidence_threshold: 0.9
  n_vec_channels: 32
  update_edge_w_distance: True
  n_hidden_scalars: 256
  n_hidden_edge_feats: 128
  s_message_dim:
  v_message_dim:
  n_expansion_gvps: 3
  attention: False
  n_heads: 32
  n_recycles: 1
  separate_mol_updaters: True
  n_molecule_updates: 6
  convs_per_update: 1
  n_cp_feats: 4
  n_message_gvps: 3
  n_update_gvps: 3
  message_norm: sum
  rbf_dmax: 10
  rbf_dim: 32
  time_embedding_dim: 64
  a_token_dim: 64
  c_token_dim: 64
  e_token_dim: 64

interpolant_scheduler:
  schedule_type:
    x: 'linear'
    a: 'linear'
    c: 'linear'
    e: 'linear'
