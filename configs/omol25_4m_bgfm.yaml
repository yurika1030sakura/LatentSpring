# Boltzmann-Guided Flow Matching (BGFM) on OMol25 4M.
# Paper 1 Level-2 upgrade config. Derived from omol25_4m_cfm.yaml with:
#   - bgfm: {enabled: true, lambda_1, lambda_2, warmup, ramp, kT}
#   - comments updated
#
# Training consumes the BGFM-preprocessed data (has forces + energies
# fields). See notes/bgfm_method.md for the formal method derivation.

training:
  output_dir: /n/holylabs/ryl_lab/Lab/yulili_cfm_mol/runs/omol25_4m_bgfm
  batch_size: 16               # bumped from 8; A100 80GB has headroom at max_atoms=200
  num_workers: 12
  ema_decay: 0
  max_num_edges: 40000         # bumped to match larger batch
  trainer_args:
    max_epochs: 20             # was 100; with 4M data 5-15 epochs is plenty
    accelerator: gpu
    devices: 1
    num_nodes: 1
    accumulate_grad_batches: 2
    limit_val_batches: 50
    gradient_clip_val: 1.0
    precision: bf16-mixed

  evaluation:
    mols_to_sample: 20
    sample_interval: 1.0
    val_loss_interval: 0.25

wandb:
  project: cfm_mol
  entity:
  name: omol25_4m_bgfm
  mode: disabled

lr_scheduler:
  base_lr: 2.0e-4
  warmup_length: 0.02
  restart_interval: 0
  restart_type: 'linear'
  weight_decay: 1.0e-12

dataset:
  dataset_name: omol25
  raw_data_dir: /n/netscratch/ryl_lab/Lab/omol25/train_4M
  processed_data_dir: /n/netscratch/ryl_lab/Lab/yulili_cfm_mol/omol25_4m_processed
  max_atoms: 200
  bond_tolerance: 1.2
  atom_map:
    - H
    - He
    - Li
    - Be
    - B
    - C
    - N
    - O
    - F
    - Ne
    - Na
    - Mg
    - Al
    - Si
    - P
    - S
    - Cl
    - Ar
    - K
    - Ca
    - Sc
    - Ti
    - V
    - Cr
    - Mn
    - Fe
    - Co
    - Ni
    - Cu
    - Zn
    - Ga
    - Ge
    - As
    - Se
    - Br
    - Kr
    - Rb
    - Sr
    - Y
    - Zr
    - Nb
    - Mo
    - Tc
    - Ru
    - Rh
    - Pd
    - Ag
    - Cd
    - In
    - Sn
    - Sb
    - Te
    - I
    - Xe
    - Cs
    - Ba
    - La
    - Ce
    - Pr
    - Nd
    - Pm
    - Sm
    - Eu
    - Gd
    - Tb
    - Dy
    - Ho
    - Er
    - Tm
    - Yb
    - Lu
    - Hf
    - Ta
    - W
    - Re
    - Os
    - Ir
    - Pt
    - Au
    - Hg
    - Tl
    - Pb
    - Bi
  dataset_size:
  confs_per_mol:

checkpointing:
  save_last: True
  save_top_k: 3
  monitor: 'val_total_loss'
  every_n_epochs: 1
  every_n_train_steps: 50000

mol_fm:
  explicit_aromaticity: false
  distort_p: 0.2
  fake_atom_p: 0.0
  parameterization: ctmc
  time_scaled_loss: True
  total_loss_weights:
    x: 3.0
    a: 0.4
    c: 1.0
    e: 0.0                    # bond-free
  prior_config:
    x:
      align: True
      type: 'centered-normal'
      kwargs: {std: 1.0}
    a:
      align: False
      type: 'ctmc'
      kwargs: {}
    c:
      align: False
      type: 'ctmc'
      kwargs: {}
    e:
      align: False
      type: 'ctmc'
      kwargs: {}

  # BGFM (Boltzmann-Guided Flow Matching) block. Read by
  # cfm_mol.bgfm_train_hook.patch_flowmol_bgfm. First-pass defaults
  # chosen for stability; grid-search in Week 3 will refine.
  #
  # kT = 1 eV (NOT 0.025 = room-T): gives F/kT ~ 0.5 mean, 50 max on
  #   OMol25 forces. Room-T kT would give F/kT ~ 2000 max, destabilizing
  #   MSE. Physical Boltzmann interpretation recovered via lambda_2
  #   (energy term) which uses variance form that is kT-scale-invariant.
  # lambda_1 = 0.1: conservative; scales up if training stable.
  # lambda_2 disabled in v1 (energy loss needs divergence integral,
  #   deferred to Week 3/4 after force-only stability confirmed).
  bgfm:
    enabled: true
    lambda_1: 0.1
    lambda_2: 0.0               # DISABLED in v1 (L_energy = 0)
    kT: 1.0                     # eV; F/kT stays numerically tame
    t_eval_values: [0.85, 0.92, 0.97]   # multi-time score probe (oral-frame)
    warmup_frac: 0.05           # 1 epoch warmup (was 10 epochs, too much)
    ramp_frac: 0.10             # ramp over 2 epochs
    divergence_method: hutchinson
    divergence_samples: 1

vector_field:
  self_conditioning: True
  stochasticity: 30.0
  high_confidence_threshold: 0.9
  n_vec_channels: 32
  update_edge_w_distance: True
  n_hidden_scalars: 256
  n_hidden_edge_feats: 128
  s_message_dim:
  v_message_dim:
  n_expansion_gvps: 3
  attention: False
  n_heads: 32
  n_recycles: 1
  separate_mol_updaters: True
  n_molecule_updates: 6
  convs_per_update: 1
  n_cp_feats: 4
  n_message_gvps: 3
  n_update_gvps: 3
  message_norm: sum
  rbf_dmax: 10
  rbf_dim: 32
  time_embedding_dim: 64
  a_token_dim: 64
  c_token_dim: 64
  e_token_dim: 64

interpolant_scheduler:
  schedule_type:
    x: 'linear'
    a: 'linear'
    c: 'linear'
    e: 'linear'
